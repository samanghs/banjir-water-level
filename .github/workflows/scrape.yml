name: 5-Minute Banjir Scraper

on:
  workflow_dispatch: # Allows cron-job.org to trigger this via API

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure repository is up to date
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        run: python banjir_tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add selangor_water_level_data.csv
          if ! git diff --staged --quiet; then
            git commit -m "Automated water level update [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new readings from sensors; CSV is already up to date."
          fi
